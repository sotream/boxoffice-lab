# Prometheus for the lab. Services run on the host (pnpm start), Prometheus runs in Docker (profile "observability"),
# so targets use host.docker.internal. Start: docker compose --profile observability up -d prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["host.docker.internal:3106"] }] # ops port (OPS_PORT) of the gateway: /metrics is not served on the public port 3100
  - job_name: inventory
    static_configs: [{ targets: ["host.docker.internal:3101"] }]
  - job_name: waiting-room
    static_configs: [{ targets: ["host.docker.internal:3102"] }]
  - job_name: payments
    static_configs: [{ targets: ["host.docker.internal:3103"] }]
  - job_name: catalog
    static_configs: [{ targets: ["host.docker.internal:3104"] }]
  - job_name: notifications # ops port of the consumer (OPS_PORT), not an HTTP API
    static_configs: [{ targets: ["host.docker.internal:3105"] }]
