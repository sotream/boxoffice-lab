<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="t d">
  <title id="t">boxoffice-lab architecture</title>
  <desc id="d">Client calls the gateway, which routes to waiting-room, catalog and inventory. Payments confirms seats in inventory and publishes through an outbox to Kafka, consumed by notifications with a dead-letter topic. Each box shows its measured number.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#33415c"/></marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#14233b}
      .h{font-size:16px;font-weight:700}
      .s{font-size:12.5px}
      .n{font-size:13px;font-weight:700;fill:#7a1f1f}
      .l{font-size:11.5px;fill:#33415c;font-style:italic}
      .svc{fill:#cfe0f5;stroke:#3b6aa8;stroke-width:1.5}
      .db{fill:#fbe3b5;stroke:#a8741a;stroke-width:1.5}
      .mq{fill:#cdeed7;stroke:#2f8a4f;stroke-width:1.5}
      .dlq{fill:#f6cfcf;stroke:#a83b3b;stroke-width:1.5}
      .e{stroke:#33415c;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="610" rx="14" fill="#f3f5f9" stroke="#c4ccd9"/>

  <rect class="svc" x="20" y="180" width="110" height="60" rx="8"/>
  <text class="h" x="75" y="207" text-anchor="middle">client</text>
  <text class="s" x="75" y="226" text-anchor="middle">50 000 users</text>

  <rect class="svc" x="170" y="110" width="200" height="200" rx="8"/>
  <text class="h" x="270" y="136" text-anchor="middle">gateway</text>
  <text class="s" x="270" y="160" text-anchor="middle">rate limiter: token bucket,</text>
  <text class="s" x="270" y="176" text-anchor="middle">Redis + Lua, shared clock</text>
  <text class="s" x="270" y="198" text-anchor="middle">admission token: HMAC,</text>
  <text class="s" x="270" y="214" text-anchor="middle">checked without Redis</text>
  <text class="n" x="270" y="246" text-anchor="middle">1 742 RPS via gateway</text>
  <text class="n" x="270" y="264" text-anchor="middle">2 244 RPS direct</text>
  <text class="s" x="270" y="288" text-anchor="middle">hop costs ~22% throughput</text>

  <rect class="svc" x="430" y="20" width="210" height="100" rx="8"/>
  <text class="h" x="535" y="46" text-anchor="middle">waiting-room</text>
  <text class="s" x="535" y="66" text-anchor="middle">virtual queue, admits 500/s</text>
  <text class="n" x="535" y="92" text-anchor="middle">~7 600 RPS / instance</text>
  <text class="s" x="535" y="110" text-anchor="middle">p99 27.8 ms</text>
  <rect class="db" x="700" y="30" width="180" height="80" rx="8"/>
  <text class="h" x="790" y="56" text-anchor="middle">Redis</text>
  <text class="s" x="790" y="75" text-anchor="middle">sorted set, ZPOPMIN</text>
  <text class="n" x="790" y="96" text-anchor="middle">~100 B per queued user</text>

  <rect class="svc" x="430" y="150" width="210" height="100" rx="8"/>
  <text class="h" x="535" y="176" text-anchor="middle">catalog</text>
  <text class="s" x="535" y="196" text-anchor="middle">search, cache-aside</text>
  <text class="n" x="535" y="222" text-anchor="middle">15 236 RPS cached</text>
  <text class="s" x="535" y="240" text-anchor="middle">684 RPS ranked, no cache</text>
  <rect class="db" x="700" y="150" width="180" height="100" rx="8"/>
  <text class="h" x="790" y="176" text-anchor="middle">Postgres + Redis</text>
  <text class="s" x="790" y="196" text-anchor="middle">tsvector + GIN index,</text>
  <text class="s" x="790" y="212" text-anchor="middle">cache TTL 30 s</text>
  <text class="n" x="790" y="236" text-anchor="middle">GIN 87x ILIKE (rare term)</text>

  <rect class="svc" x="430" y="280" width="210" height="100" rx="8"/>
  <text class="h" x="535" y="306" text-anchor="middle">inventory</text>
  <text class="s" x="535" y="326" text-anchor="middle">conditional UPDATE hold</text>
  <text class="n" x="535" y="352" text-anchor="middle">~2 300 hold RPS / instance</text>
  <text class="s" x="535" y="370" text-anchor="middle">p99 37.7 ms, 0 oversell</text>
  <rect class="db" x="700" y="280" width="180" height="100" rx="8"/>
  <text class="h" x="790" y="306" text-anchor="middle">Postgres</text>
  <text class="s" x="790" y="326" text-anchor="middle">one row per seat</text>
  <text class="s" x="790" y="342" text-anchor="middle">lazy hold expiry</text>
  <text class="n" x="790" y="366" text-anchor="middle">~50 connections at peak</text>

  <rect class="svc" x="170" y="430" width="200" height="110" rx="8"/>
  <text class="h" x="270" y="456" text-anchor="middle">payments</text>
  <text class="s" x="270" y="476" text-anchor="middle">saga, idempotency key,</text>
  <text class="s" x="270" y="492" text-anchor="middle">Postgres outbox + relay</text>
  <text class="n" x="270" y="518" text-anchor="middle">~700 payments/s / instance</text>

  <rect class="mq" x="440" y="440" width="170" height="90" rx="8"/>
  <text class="h" x="525" y="466" text-anchor="middle">Kafka (Redpanda)</text>
  <text class="s" x="525" y="486" text-anchor="middle">payments, 3 partitions</text>
  <text class="n" x="525" y="512" text-anchor="middle">at-least-once</text>

  <rect class="svc" x="680" y="440" width="200" height="90" rx="8"/>
  <text class="h" x="780" y="466" text-anchor="middle">notifications</text>
  <text class="s" x="780" y="486" text-anchor="middle">dedup key, lease, retries</text>
  <text class="n" x="780" y="512" text-anchor="middle">1 393 deliveries/s</text>

  <rect class="dlq" x="700" y="560" width="160" height="34" rx="8"/>
  <text class="s" x="780" y="582" text-anchor="middle">payments.dlq (10 poison)</text>

  <path class="e" d="M130 210 H170" marker-end="url(#a)"/>
  <path class="e" d="M370 150 H400 V70 H430" marker-end="url(#a)"/>
  <path class="e" d="M370 200 H430" marker-end="url(#a)"/>
  <path class="e" d="M370 270 H400 V330 H430" marker-end="url(#a)"/>
  <path class="e" d="M640 70 H700" marker-end="url(#a)"/>
  <path class="e" d="M640 200 H700" marker-end="url(#a)"/>
  <path class="e" d="M640 330 H700" marker-end="url(#a)"/>
  <path class="e" d="M75 240 V485 H170" marker-end="url(#a)"/>
  <text class="l" x="82" y="400">pay</text>
  <path class="e" d="M330 430 V400 H460 V380" marker-end="url(#a)"/>
  <text class="l" x="338" y="418">confirm seats</text>
  <path class="e" d="M370 490 H440" marker-end="url(#a)"/>
  <text class="l" x="372" y="482">outbox</text>
  <path class="e" d="M610 485 H680" marker-end="url(#a)"/>
  <path class="e" d="M780 530 V560" marker-end="url(#a)"/>
  <text class="l" x="790" y="550">after 4 attempts</text>
  <text class="l" x="20" y="595">MacBook Air M1, k6 on the same machine: per-instance planning numbers.</text>
</svg>
